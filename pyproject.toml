[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samyak"
version = "0.1.0"
description = "Samyak revenue recovery control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "ortools",
    "lightgbm",
    "pyyaml",
    "pytest",
    "ruff",
    "fastapi",
    "uvicorn"
]

[tool.setuptools.packages.find]
include = ["core*", "sim*", "console*"]

