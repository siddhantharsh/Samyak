  - id: "LINK_01"
    category: "transactional"
    language: "en"
    body: "Your mandate for {#var1#} failed. Tap here to pay via alternate method: {#var2#}"
    whitelisted_urls:
      - "rzp.io"
      - "razorpay.com"
